[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mygv"
version = "0.1.0"
description = "myGV the little genome browser that could."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Istvan Albert", email = "istvan.albert@gmail.com" }]
dependencies = ["biopython>=1.84", "click>=8", "pyfaidx>=0.8"]

[project.scripts]
mygv = "mygv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mygv.gui" = ["*.json"]
"mygv.data" = ["fasta/*", "gff/*"]
